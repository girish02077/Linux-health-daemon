name: Deploy Health Daemon

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Local Syntax Validation Test
        run: bash ./tests/validate.sh

      - name: Copy Scripts Locally
        run: |
          mkdir -p ~/health-daemon/scripts
          cp -r scripts/* ~/health-daemon/scripts/

      - name: Execute Local Audit Test
        run: |
          chmod +x ~/health-daemon/scripts/health-check.sh
          ~/health-daemon/scripts/health-check.sh
